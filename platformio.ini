[env:esp32dev]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

lib_deps =
    bblanchon/ArduinoJson@6.21.4
    tzapu/WiFiManager

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_rts = 0
monitor_dtr = 0